<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskHub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='create_task.css') }}">
<script src="{{ url_for('static', filename='create_task.js') }}" defer></script>
</head>
<body>

  <header class="th-header">
    <span class="th-brand">Task<span class="mark">Hub</span></span>

    <nav class="th-nav">
        <a href="/tasks">View Tasks</a>
        <a href="/about">About</a>
    </nav>
  </header>

  <div class="page">
    <div class="th-card create-card">

      <p class="eyebrow">New entry</p>
      <h1>Add a task</h1>
      <p class="subtitle">Write it down so it doesn't slip your mind</p>

      <form action="/create" method="POST">

        <div class="th-field">
          <label>Title</label>
          <input name="title" type="text" placeholder="e.g. Submit assignment" required />
        </div>

        <div class="th-field">
          <label>Description</label>
          <input name="description" type="text" placeholder="Any extra detail" />
        </div>

        <div class="th-field">
          <label>Category</label>
          <select name="category">
            <option value="Work">Work</option>
            <option value="School">School</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Birthday">Birthday</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="th-field">
          <label>Priority</label>
          <select name="priority">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>

        <div class="th-field">
          <label>Due date</label>
          <input name="due_date" type="datetime-local" required />
        </div>

        <button type="submit" class="btn btn-primary submit-btn">Add task</button>

      </form>

    </div>
  </div>

</body>
</html>
